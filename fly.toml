app = 'apple-music-mcp'
primary_region = 'arn'

[build]

[env]
  PORT = '3000'
  APPLE_STOREFRONT = 'dk'
  SERVER_URL = 'https://music.quiz-mash.com'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  # F391 24/9 2026 (ejerens GO): kold
[mounts]
  source = "data"
  destination = "/data"

[[vm]]
  memory = '256mb'
  # F391 24/9 2026 (ejerens GO): 7d-top 164 MB — 256 MB
  cpu_kind = 'shared'
  cpus = 1
